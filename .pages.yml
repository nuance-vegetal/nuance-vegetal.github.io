# Configuration de Pages CMS (https://pagescms.org) : les formulaires pour modifier le site sans code.
# Chaque « Save » met le site à jour en une minute environ.

media:
  input: images
  output: images
  categories:
  - image
content:
- name: pages
  label: Textes des pages du site
  type: group
  items:
  - name: enquete
    label: Accueil – chiffres de l'enquête
    type: file
    path: donnees/enquete.json
    format: json
    fields:
    - name: chiffres
      label: Cartes « ce que l'enquête a révélé »
      description: Les grands chiffres qui comptent quand on fait défiler la page.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{valeur}{unite} {texte}'
      fields:
      - name: valeur
        label: Nombre
        description: Seulement le nombre, par exemple 14
        type: number
        required: true
      - name: unite
        label: Après le nombre
        description: Par exemple « %», avec un espace avant le %. Laisse vide s'il n'y a rien après le nombre.
        type: string
      - name: texte
        label: Phrase
        type: text
        required: true
      - name: misEnAvant
        label: Grande carte verte
        description: 'Cocher pour une seule carte : la plus importante.'
        type: boolean
    - name: bandeau
      label: Bandeau qui défile sous le titre
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{chiffre} {texte}'
      fields:
      - name: chiffre
        label: Chiffre (en vert)
        description: 'Par exemple : 8 sur 10 ou 52 %'
        type: string
        required: true
      - name: texte
        label: Suite de la phrase
        description: 'Par exemple : aiment le goût'
        type: string
        required: true
  - name: assiette
    label: Accueil – « Sa place dans l'assiette »
    type: file
    path: donnees/assiette.json
    format: json
    fields:
    - name: texte
      label: Texte
      description: "Mise en forme : **mot** = gras ; [atteint], [à surveiller], [non renseigné] = pastilles de couleur ; une ligne vide = nouveau paragraphe."
      type: text
      required: true
    - name: note
      label: Petite note sous le texte
      description: Par exemple « [Texte à compléter par Camille] ». Laisse vide quand le texte est validé.
      type: string
  - name: etiquette
    label: Étiquette décortiquée – produit, 5 commentaires, à retenir, additifs
    type: file
    path: donnees/etiquette.json
    format: json
    fields:
    - name: produit
      label: L'étiquette du produit fictif
      type: object
      fields:
      - name: nom
        label: Nom du produit
        type: string
      - name: details
        label: Ligne sous le nom
        type: string
      - name: ingredients
        label: Ingrédients
        type: text
      - name: commentaireIngredients
        label: Numéro du commentaire à côté de « Ingrédients »
        description: 1 = le premier commentaire. Laisse vide pour ne pas mettre de numéro.
        type: number
      - name: traces
        label: Traces
        type: string
      - name: valeurs
        label: Valeurs nutritionnelles pour 100 g
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{nom} : {valeur}'
        fields:
        - name: nom
          label: Nom
          type: string
        - name: valeur
          label: Valeur
          type: string
        - name: commentaire
          label: Numéro du commentaire
          description: Le petit rond cliquable qui ouvre le commentaire. Laisse vide s'il n'y en a pas.
          type: number
        - name: sousLigne
          label: Ligne « dont… » (décalée)
          type: boolean
      - name: note
        label: Note sous le tableau
        type: string
    - name: commentaires
      label: Les commentaires
      description: "Dans l'ordre : le premier porte le numéro 1, le deuxième le numéro 2…"
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        description: "Mise en forme : **mot** = gras ; [atteint], [à surveiller], [non renseigné] = pastilles de couleur ; une ligne vide = nouveau paragraphe."
        type: text
      - name: source
        label: Source ou note
        type: string
    - name: aRetenir
      label: Carte « à retenir »
      type: object
      fields:
      - name: titre
        label: Petit titre
        type: string
      - name: texte
        label: Texte
        type: text
      - name: note
        label: Note
        description: Laisse vide quand le texte est validé.
        type: string
    - name: additifs
      label: Encadré « les additifs »
      type: object
      fields:
      - name: titre
        label: Titre
        type: string
      - name: texte
        label: Texte
        description: "Mise en forme : **mot** = gras ; [atteint], [à surveiller], [non renseigné] = pastilles de couleur ; une ligne vide = nouveau paragraphe."
        type: text
      - name: sources
        label: Sources
        type: string
  - name: bases
    label: Les bases – fiches tofu, seitan, Quorn…
    type: file
    path: donnees/bases.json
    format: json
    fields:
    - name: fiches
      label: Les fiches (une par base)
      description: Clique sur une fiche pour l'ouvrir. Glisse les fiches pour changer leur ordre sur le site.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nom} · {base}'
      fields:
      - name: nom
        label: Nom
        description: 'Par exemple : Tofu'
        type: string
        required: true
      - name: base
        label: Famille (pour les boutons de filtre)
        type: select
        required: true
        options:
          values:
          - Soja
          - Blé
          - Champignon
          - Pois
          - Autre
      - name: description
        label: Description
        description: 'Une ou deux phrases simples : de quoi c''est fait.'
        type: text
      - name: proteines
        label: Protéines
        description: 'Par exemple : ≈ 12 à 15 g pour 100 g'
        type: string
      - name: allergenes
        label: Allergènes
        description: Un allergène par ligne.
        type: string
        list: true
      - name: enquete
        label: Résultat de l'enquête
        description: 'Affiché dans l''encadré bleu, par exemple : 30 % des répondants pensent qu''il contient du blé.'
        type: string
      - name: sources
        label: Sources
        type: string
      - name: image
        label: Photo
        description: Format paysage, la plus légère possible (moins de 200 Ko).
        type: image
      - name: image_description
        label: Description de la photo
        description: Ce qu'on voit sur la photo, en quelques mots. Elle est lue aux personnes aveugles.
        type: string
  - name: equivalences
    label: Équivalences et complémentarité
    type: file
    path: donnees/equivalences.json
    format: json
    fields:
    - name: intro
      label: Phrase d'introduction
      type: text
    - name: quantiteParDefaut
      label: Quantité de viande au départ (g)
      type: number
    - name: phraseQualite
      label: Phrase sous les équivalences
      type: text
    - name: alternatives
      label: Les alternatives
      description: Équivalent de 100 g de viande, poisson ou poulet crus. Le site fait la règle de trois pour les autres quantités.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nom} : {quantite} {unite}'
      fields:
      - name: nom
        label: Nom
        type: string
        required: true
      - name: quantite
        label: Quantité pour 100 g de viande
        description: En grammes (secs pour les légumineuses), ou en nombre d'œufs.
        type: number
        required: true
      - name: unite
        label: Unité
        description: « g », ou « œufs » pour une fourchette arrondie à l'œuf entier.
        type: string
      - name: quantiteMax
        label: Haut de la fourchette (œufs seulement)
        description: Par exemple 3 pour « 2 à 3 œufs ». 0 = pas de fourchette.
        type: number
      - name: quantiteCuite
        label: Quantité cuite (g, légumineuses seulement)
        description: 0 = ne pas afficher.
        type: number
      - name: cuilleres
        label: Cuillères à soupe pour la quantité cuite
        description: 0 = ne pas afficher.
        type: number
      - name: image
        label: Photo de la carte
        description: Format paysage, léger. Laisse vide pour une carte de couleur (comme les œufs).
        type: image
      - name: taille
        label: Taille de la carte
        type: select
        options:
          values:
          - name: grande
            label: Grande (la première)
          - name: large
            label: Large
          - name: normale
            label: Normale
    - name: source
      label: Source courte des équivalences
      description: Par exemple « VVK 2019, p. 24 ». La référence complète va dans « Sources » en bas.
      type: string
    - name: noteEquivalences
      label: Note
      description: Laisse vide quand les valeurs sont validées.
      type: string
    - name: complementarite
      label: Complémentarité des protéines
      type: object
      fields:
      - name: principe
        label: Le principe
        description: "Mise en forme : **mot** = gras ; [atteint], [à surveiller], [non renseigné] = pastilles de couleur ; une ligne vide = nouveau paragraphe."
        type: text
      - name: phrase
        label: Phrase mise en avant
        type: text
      - name: source
        label: Source courte du principe
        description: Par exemple « VVK 2019, p. 23–25 ».
        type: string
      - name: note
        label: Note
        description: Laisse vide quand le texte est validé.
        type: string
      - name: associations
        label: Les assiettes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{titre}'
        fields:
        - name: titre
          label: Titre
          type: string
          required: true
        - name: familles
          label: Ce qu'on voit dans l'assiette
          description: Un ou deux mots par case, par exemple « céréales » puis « légumineuses ».
          type: string
          list: true
        - name: exemples
          label: Exemples d'assiettes
          type: string
          list: true
        - name: pourquoi
          label: Pourquoi ça marche
          type: text
        - name: source
          label: Source courte
          description: Par exemple « Edwards & Cummings, 2010 ». La référence complète va dans « Sources » en bas.
          type: string
    - name: sources
      label: Sources (en bas de la page)
      description: Les références complètes, avec leur lien.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{texte}'
      fields:
      - name: texte
        label: Référence complète
        type: text
        required: true
      - name: url
        label: Lien
        description: Commence par https://. Laisse vide s'il n'y en a pas.
        type: string
  - name: nutriments
    label: À quoi ça sert ? – fiches B12, protéines, fer, additifs, allégations
    type: file
    path: donnees/nutriments.json
    format: json
    fields:
    - name: fiches
      label: Les fiches
      description: Une fiche par nutriment. Clique sur une fiche pour l'ouvrir et remplir les cases. Remplace les « [à compléter
        par Camille] ».
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
        description: 'Par exemple : Vitamine B12'
      - name: resume
        label: Résumé en une ligne
        type: string
        description: 'Affiché sous le titre, avant d''ouvrir la fiche. Exemple : indispensable, et absente des végétaux.'
      - name: aQuoiCaSert
        label: À quoi ça sert ?
        type: text
        description: Le rôle dans le corps, en quelques phrases simples.
      - name: ouLaTrouver
        label: Où le trouver ?
        type: string
        list: true
        description: Une source alimentaire par ligne.
      - name: surEtiquette
        label: Sur l'étiquette
        type: text
        description: Comment le repérer dans la liste d'ingrédients ou le tableau nutritionnel.
      - name: conseil
        label: Conseil pratique
        type: text
        description: Affiché dans l'encadré bleu. Laisse vide s'il n'y en a pas.
      - name: sources
        label: Sources
        type: object
        list:
          collapsible:
            collapsed: false
            summary: '{texte}'
        fields:
        - name: texte
          label: Référence
          type: text
          description: Auteur (année). Titre. Revue.
        - name: url
          label: Lien (facultatif)
          type: string
      - name: brouillon
        label: Brouillon
        type: boolean
        default: true
        description: 'Coché : le site affiche « Brouillon à valider ». Décoche quand le texte est validé.'
      - name: id
        label: Identifiant (ne pas modifier)
        type: string
        readonly: true
        description: Sert aux liens « ? » du décodeur.
  - name: etudes
    label: Études – questions et réponses
    type: file
    path: donnees/etudes.json
    format: json
    fields:
    - name: fiches
      label: Les fiches (une par question)
      description: Clique sur une fiche pour l'ouvrir. « Add an entry » en bas pour en ajouter une. Glisse les fiches pour
        changer leur ordre sur le site.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{index}. {question}'
      fields:
      - name: question
        label: Question
        description: 'La question telle qu''elle s''affiche, par exemple : Le soja est-il mauvais pour les hormones ?'
        type: string
        required: true
      - name: reponse
        label: Réponse courte
        description: Une ou deux phrases, en gras sur le site.
        type: text
        required: true
      - name: points
        label: Points clés
        description: Une phrase par point. « Add an entry » pour ajouter un point.
        type: string
        list: true
      - name: conseil
        label: Conseil pratique
        description: Affiché dans l'encadré bleu. Laisse vide s'il n'y en a pas.
        type: text
      - name: niveau
        label: Niveau de preuve
        description: 1 = faible · 2 = moyen · 3 = élevé
        type: number
        options:
          min: 1
          max: 3
      - name: sources
        label: Sources
        description: Une source par ligne. Le lien est facultatif (DOI ou adresse du site).
        type: object
        list:
          collapsible:
            collapsed: false
            summary: '{texte}'
        fields:
        - name: texte
          label: Référence
          description: Auteur (année). Titre. Revue.
          type: text
        - name: url
          label: Lien (facultatif)
          description: Par exemple https://doi.org/10.3390/nu8120754
          type: string
      - name: brouillon
        label: Brouillon
        description: 'Coché : le site affiche « Brouillon à valider ». Décoche quand le texte est validé.'
        type: boolean
        default: true
  - name: fichePdf
    label: Fiche PDF – titres, textes et encadrés
    type: file
    path: donnees/fiche-pdf.json
    format: json
    fields:
    - name: sousTitre
      label: Phrase sous « nuance végétale »
      type: string
    - name: titreReperes
      label: Titre des repères
      description: Les seuils eux-mêmes se changent dans « Décodeur, scan et fiche PDF – repères du CSS ».
      type: string
    - name: introReperes
      label: Petit texte avant les repères
      type: string
    - name: noteReperes
      label: Petit texte après les repères
      type: string
    - name: sections
      label: Les rubriques
      description: Dans l'ordre de la fiche. **mot** = gras.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
      - name: nouvellePage
        label: Commencer une nouvelle page du PDF
        type: boolean
      - name: texte
        label: Paragraphe
        type: text
      - name: points
        label: Liste à puces
        type: text
        list: true
      - name: encadre
        label: Encadré de couleur
        description: Laisse le texte vide pour ne pas afficher d'encadré.
        type: object
        fields:
        - name: titre
          label: Titre de l'encadré
          type: string
        - name: texte
          label: Texte de l'encadré
          type: text
        - name: couleur
          label: Couleur
          type: select
          options:
            values:
            - name: bleu
              label: Bleu
            - name: orange
              label: Orange
    - name: titreBio
      label: Titre des logos bio
      type: string
    - name: noteBio
      label: Texte sous les logos bio
      type: text
    - name: titreQr
      label: Texte à côté du QR code
      type: string
    - name: piedPage
      label: Dernière ligne de la fiche
      type: text
  - name: createurs
    label: Créateurs
    type: file
    path: donnees/createurs.json
    format: json
    fields:
    - name: intro
      label: Introduction
      type: text
    - name: personnes
      label: Les personnes
      description: Une carte par personne. Une carte sans nom n'est pas affichée.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{role} : {nom}'
      fields:
      - name: role
        label: Rôle
        description: Par exemple « Autrice du TFE », « Professeure », « Promoteur ».
        type: string
      - name: nom
        label: Prénom et nom
        type: string
      - name: detail
        label: Précision
        type: string
    - name: ecole
      label: L'école
      type: object
      fields:
      - name: nom
        label: Nom de l'école
        type: string
      - name: lieu
        label: Ville
        type: string
      - name: formation
        label: Formation
        type: string
    - name: autres
      label: Autres infos
      description: "Mise en forme : **mot** = gras ; [atteint], [à surveiller], [non renseigné] = pastilles de couleur ; une ligne vide = nouveau paragraphe."
      type: text
- name: parametres
  label: Réglages
  type: group
  items:
  - name: couleurs
    label: Couleurs du site
    type: file
    path: donnees/theme.json
    format: json
    fields:
    - name: atelier
      label: Atelier couleurs (nuancier + aperçu du site)
      type: string
      readonly: true
      default: https://nuance-vegetal.github.io/atelier-couleurs.html
      description: 'Copie cette adresse et ouvre-la dans un nouvel onglet : tu y choisis tes couleurs avec un aperçu du site,
        puis tu colles les codes plus bas dans « Couleurs personnalisées ».'
    - name: theme
      label: Ambiance de couleurs
      type: select
      required: true
      description: 'Une ambiance prête : fond, cartes, boutons et logo changent ensemble. Les feux vert / orange / rouge ne
        changent jamais. Ignorée si « Utiliser mes couleurs » est coché plus bas.'
      options:
        values:
        - name: sauge
          label: Sauge (vert, actuel)
        - name: terracotta
          label: Terracotta (brique)
        - name: lavande
          label: Lavande (violet doux)
        - name: ocean
          label: Océan (bleu-vert)
        - name: olive
          label: Olive (vert kaki)
        - name: cacao
          label: Cacao (brun chaud)
        - name: framboise
          label: Framboise (rose poudré)
    - name: personnalise
      label: Couleurs personnalisées
      type: object
      description: Colle ici les codes copiés dans l'atelier couleurs (adresse tout en haut), puis coche « Utiliser mes couleurs
        ».
      fields:
      - name: actif
        label: Utiliser mes couleurs (au lieu de l'ambiance)
        type: boolean
        default: false
      - name: fond
        label: Fond de page
        type: string
        pattern: &id001
          regex: ^(#[0-9A-Fa-f]{6})?$
          message: 'Un code couleur commence par # suivi de 6 caractères, par exemple #2F6B4F'
        description: 'Exemple : #F6EFE3'
      - name: carte
        label: Cartes
        type: string
        pattern: *id001
        description: 'Exemple : #FDF9F1'
      - name: principal
        label: Couleur principale (boutons, accents, pied de page)
        type: string
        pattern: *id001
        description: 'Exemple : #2F6B4F'
      - name: texte
        label: Texte
        type: string
        pattern: *id001
        description: 'Exemple : #1F2D25'
  - name: reglages
    label: Décodeur, scan et fiche PDF – repères du CSS
    type: file
    path: donnees/reglages.json
    format: json
    fields:
    - name: css
      label: Les 6 repères (Conseil Supérieur de la Santé, avis n° 9445)
      description: 'Pour 100 g. Nombres à virgule : tape un point, par exemple 1.1. À vérifier dans l''avis original
        avant de changer quoi que ce soit. La règle « saturées ≤ 1/3 des matières grasses » est fixe.'
      type: object
      fields:
      - name: proteinesMin
        label: Protéines – atteint si plus de… g
        type: number
      - name: grassesMax
        label: Matières grasses – atteint si moins de… g (et moins que les protéines)
        type: number
      - name: saturesMax
        label: Graisses saturées – atteint si moins de… g (et au plus 1/3 des graisses)
        type: number
      - name: selMax
        label: Sel – atteint jusqu'à… g
        type: number
      - name: ferMin
        label: Fer – atteint si plus de… mg
        type: number
      - name: b12Min
        label: Vitamine B12 – atteint si plus de… µg
        type: number
      - name: allegationRiche
        label: Allégation « riche en protéines » à partir de… % de l'énergie
        description: Règlement (CE) n° 1924/2006. C'est une info, pas un critère.
        type: number
      - name: allegationSource
        label: Allégation « source de protéines » à partir de… % de l'énergie
        type: number
      - name: reference
        label: Référence affichée sous les résultats
        type: string
    - name: scanInfos
      label: Infos affichées après un scan
      description: Coche ce qui doit apparaître sous le produit scanné, en plus des 6 repères (le fer et la B12 en font partie).
      type: select
      options:
        multiple: true
        values:
        - name: gluten
          label: Gluten
        - name: lait
          label: Lait (lactose)
        - name: autresAllergenes
          label: Autres allergènes
        - name: vegan
          label: Végan
        - name: huilePalme
          label: Huile de palme
        - name: additifs
          label: Additifs
        - name: bio
          label: Bio
  - name: scanner
    label: Scanner – mots-clés végan et catégories
    type: file
    path: donnees/scanner.json
    format: json
    fields:
    - name: messageNonAlternative
      label: Message pour la viande, le poisson, les laitiers et les œufs
      description: Affiché à la place des 6 repères.
      type: text
    - name: mentionsVegan
      label: Mentions « vegan » reconnues (toutes langues)
      description: Cherchées dans le nom et les labels du produit. Majuscules et accents ignorés.
      type: string
      list: true
    - name: negations
      label: Mots qui annulent une mention vegan juste avant
      description: Par exemple « non » dans « non vegan », « not », « niet ».
      type: string
      list: true
    - name: motsCles
      label: Mots-clés dans les ingrédients, par langue
      description: Seulement quand Open Food Facts ne donne ni label ni analyse. Jamais affichés aux visiteurs. Majuscules et accents ignorés, mots entiers seulement.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{langue}'
      fields:
      - name: langue
        label: Langue
        type: string
      - name: nonVegan
        label: Non végan
        description: Un mot trouvé = « non végan ».
        type: string
        list: true
      - name: peutEtreVegan
        label: Peut-être végan (ne conclut rien)
