# Configuration de Pages CMS (https://pagescms.org) : les formulaires pour modifier le site sans code.
# Chaque « Save » met le site à jour en une minute environ.

media:
  input: images
  output: images
  categories:
  - image
content:
- name: pages
  label: Textes des pages du site
  type: group
  items:
  - name: enquete
    label: Accueil – chiffres de l'enquête
    type: file
    path: donnees/enquete.json
    format: json
    fields:
    - name: chiffres
      label: Cartes « ce que l'enquête a révélé »
      description: Les grands chiffres qui comptent quand on fait défiler la page.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{valeur}{unite} {texte}'
      fields:
      - name: valeur
        label: Nombre
        description: Seulement le nombre, par exemple 14
        type: number
        required: true
      - name: unite
        label: Après le nombre
        description: Par exemple « %», avec un espace avant le %. Laisse vide s'il n'y a rien après le nombre.
        type: string
      - name: texte
        label: Phrase
        type: text
        required: true
      - name: misEnAvant
        label: Grande carte verte
        description: 'Cocher pour une seule carte : la plus importante.'
        type: boolean
    - name: bandeau
      label: Bandeau qui défile sous le titre
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{chiffre} {texte}'
      fields:
      - name: chiffre
        label: Chiffre (en vert)
        description: 'Par exemple : 8 sur 10 ou 52 %'
        type: string
        required: true
      - name: texte
        label: Suite de la phrase
        description: 'Par exemple : aiment le goût'
        type: string
        required: true
  - name: bases
    label: Les bases – fiches tofu, seitan, Quorn…
    type: file
    path: donnees/bases.json
    format: json
    fields:
    - name: fiches
      label: Les fiches (une par base)
      description: Clique sur une fiche pour l'ouvrir. Glisse les fiches pour changer leur ordre sur le site.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nom} · {base}'
      fields:
      - name: nom
        label: Nom
        description: 'Par exemple : Tofu'
        type: string
        required: true
      - name: base
        label: Famille (pour les boutons de filtre)
        type: select
        required: true
        options:
          values:
          - Soja
          - Blé
          - Champignon
          - Pois
          - Autre
      - name: description
        label: Description
        description: 'Une ou deux phrases simples : de quoi c''est fait.'
        type: text
      - name: proteines
        label: Protéines
        description: 'Par exemple : ≈ 12 à 15 g pour 100 g'
        type: string
      - name: allergenes
        label: Allergènes
        description: Un allergène par ligne.
        type: string
        list: true
      - name: enquete
        label: Résultat de l'enquête
        description: 'Affiché dans l''encadré bleu, par exemple : 30 % des répondants pensent qu''il contient du blé.'
        type: string
      - name: sources
        label: Sources
        type: string
      - name: image
        label: Photo
        description: Format paysage, la plus légère possible (moins de 200 Ko).
        type: image
      - name: image_description
        label: Description de la photo
        description: Ce qu'on voit sur la photo, en quelques mots. Elle est lue aux personnes aveugles.
        type: string
  - name: etudes
    label: Études – questions et réponses
    type: file
    path: donnees/etudes.json
    format: json
    fields:
    - name: fiches
      label: Les fiches (une par question)
      description: Clique sur une fiche pour l'ouvrir. « Add an entry » en bas pour en ajouter une. Glisse les fiches pour
        changer leur ordre sur le site.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{index}. {question}'
      fields:
      - name: question
        label: Question
        description: 'La question telle qu''elle s''affiche, par exemple : Le soja est-il mauvais pour les hormones ?'
        type: string
        required: true
      - name: reponse
        label: Réponse courte
        description: Une ou deux phrases, en gras sur le site.
        type: text
        required: true
      - name: points
        label: Points clés
        description: Une phrase par point. « Add an entry » pour ajouter un point.
        type: string
        list: true
      - name: conseil
        label: Conseil pratique
        description: Affiché dans l'encadré bleu. Laisse vide s'il n'y en a pas.
        type: text
      - name: niveau
        label: Niveau de preuve
        description: 1 = faible · 2 = moyen · 3 = élevé
        type: number
        options:
          min: 1
          max: 3
      - name: sources
        label: Sources
        description: Une source par ligne. Le lien est facultatif (DOI ou adresse du site).
        type: object
        list:
          collapsible:
            collapsed: false
            summary: '{texte}'
        fields:
        - name: texte
          label: Référence
          description: Auteur (année). Titre. Revue.
          type: text
        - name: url
          label: Lien (facultatif)
          description: Par exemple https://doi.org/10.3390/nu8120754
          type: string
      - name: brouillon
        label: Brouillon
        description: 'Coché : le site affiche « Brouillon à valider ». Décoche quand le texte est validé.'
        type: boolean
        default: true
- name: parametres
  label: Réglages
  type: group
  items:
  - name: couleurs
    label: Couleurs du site
    type: file
    path: donnees/theme.json
    format: json
    fields:
    - name: theme
      label: Ambiance de couleurs
      type: select
      required: true
      description: 'Choisis une ambiance : fond, cartes, boutons et logo changent ensemble. Les feux vert / orange / rouge
        ne changent jamais.'
      options:
        values:
        - name: sauge
          label: Sauge (vert, actuel)
        - name: terracotta
          label: Terracotta (brique)
        - name: lavande
          label: Lavande (violet doux)
        - name: ocean
          label: Océan (bleu-vert)
        - name: olive
          label: Olive (vert kaki)
        - name: cacao
          label: Cacao (brun chaud)
        - name: framboise
          label: Framboise (rose poudré)
    - name: couleurPrincipale
      label: Couleur principale (facultatif)
      type: string
      description: 'Pour changer seulement la couleur des boutons et des titres en accent. Laisse vide pour garder celle de
        l''ambiance. Exemple : #2F6B4F (trouve un code sur htmlcolorcodes.com/fr). Si la couleur est trop claire, le site
        la fonce un peu pour que le texte reste lisible.'
      pattern:
        regex: ^(#[0-9A-Fa-f]{6})?$
        message: 'Un code couleur commence par # suivi de 6 caractères, par exemple #2F6B4F'
  - name: reglages
    label: Décodeur, scan et fiche frigo – seuils des feux
    type: file
    path: donnees/reglages.json
    format: json
    fields:
    - name: proteines
      label: Protéines (part de l'énergie, en %)
      description: À modifier seulement après validation dans la revue de littérature.
      type: object
      fields:
      - name: vertMin
        label: Vert « Riche » à partir de… %
        type: number
      - name: orangeMin
        label: 'Orange « Source » à partir de… % (en dessous : rouge « Faible »)'
        type: number
      - name: reference
        label: Référence affichée
        type: string
    - name: sel
      label: Sel (grammes pour 100 g)
      description: 'Nombres à virgule : tape un point, par exemple 0.3'
      type: object
      fields:
      - name: vertMax
        label: Vert « Faible » jusqu'à… g
        type: number
      - name: orangeMax
        label: 'Orange « Moyen » jusqu''à… g (au-dessus : rouge « Élevé »)'
        type: number
      - name: reference
        label: Référence affichée
        type: string
    - name: satures
      label: Graisses saturées (grammes pour 100 g)
      description: 'Nombres à virgule : tape un point, par exemple 1.5'
      type: object
      fields:
      - name: vertMax
        label: Vert « Faible » jusqu'à… g
        type: number
      - name: orangeMax
        label: 'Orange « Moyen » jusqu''à… g (au-dessus : rouge « Élevé »)'
        type: number
      - name: reference
        label: Référence affichée
        type: string
    - name: portionGrammes
      label: Taille d'une portion (g)
      description: Sert à calculer le sel par portion.
      type: number
    - name: selRepereJour
      label: Repère de sel par jour (g)
      description: 6 = apport de référence européen · l'OMS conseille moins de 5.
      type: number
    - name: scanInfos
      label: Infos affichées après un scan
      description: Coche ce qui doit apparaître sous le produit scanné.
      type: select
      options:
        multiple: true
        values:
        - name: b12
          label: Vitamine B12
        - name: fer
          label: Fer
        - name: gluten
          label: Gluten
        - name: lait
          label: Lait (lactose)
        - name: autresAllergenes
          label: Autres allergènes
        - name: vegan
          label: Végan
        - name: huilePalme
          label: Huile de palme
        - name: additifs
          label: Additifs
        - name: bio
          label: Bio
